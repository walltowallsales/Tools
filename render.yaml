services:
  - type: web
    name: sellerchamp-tools
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SELLERCHAMP_TOKEN
        sync: false
      - key: APP_PIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SELLERCHAMP_BASE_URL
        value: https://app.sellerchamp.com
      - key: QUALIFYING_ORDER_STATUS
        value: unshipped
      - key: ORDER_LOOKBACK_DAYS
        value: 30
      - key: DELETE_BATCH_PIN
        sync: false
      - key: SC_SHIP_FROM_ADDRESS_ID
        sync: false
      - key: SC_EBAY_TEMPLATE_ID
        sync: false
      - key: DATA_ROOT
        value: /var/data
    disk:
      name: sellerchamp-tools-data
      mountPath: /var/data
      sizeGB: 1
