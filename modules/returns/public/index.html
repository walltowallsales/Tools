<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>SellerChamp Returns</title>
  <link rel="stylesheet" href="styles.css">
  <style>.suite-back{display:block;background:#10233f;color:#e6efff;text-decoration:none;font-weight:850;font-size:16px;padding:13px max(16px,env(safe-area-inset-left))}</style>
</head>
<body>
<a class="suite-back" href="/">← SellerChamp Tools</a>
<div id="pinGate" class="gate hidden"><form id="pinForm" class="card narrow"><h1>Returns</h1><p>Enter PIN</p><input id="pin" inputmode="numeric" type="password" autocomplete="off"><button>Unlock</button><p id="pinError" class="error"></p></form></div>
<header><h1>SellerChamp Returns <small style="font-size:.45em;opacity:.75">V2-48</small></h1><nav><button class="tab active" data-tab="intake">1. Return Intake</button><button class="tab" data-tab="back">2. Process Returns</button><button class="tab" data-tab="archived">3. Archived</button><button class="tab" data-tab="direct">4. Add Direct</button></nav></header>
<main>
<section id="intake" class="panel active"><div class="card"><h2>Find Order</h2><label>eBay Order ID</label><div class="row"><input id="orderInput" inputmode="numeric" pattern="[0-9-]*" placeholder="12-34567-89012" maxlength="14"><button id="speakOrder" type="button" class="secondary">🎤 Speak Order</button><button id="cancelSpeakOrder" type="button" class="danger hidden">Cancel Listening</button><button id="findOrder">Find Order</button></div><p class="hint">Type numbers only if you prefer; hyphens are added automatically.</p><p id="orderError" class="error"></p></div><div id="orderResults"></div></section>
<section id="back" class="panel"><div class="card"><div class="row spread"><div><h2>Returns Queue</h2><p class="hint">Sorted by item location.</p></div><button id="refreshQueue" class="secondary">Refresh</button></div><div id="queue"></div></div><div id="detail"></div></section>
<section id="archived" class="panel"><div class="card"><div class="row spread"><div><h2>Archived Returns</h2><p class="hint">Completed returns are kept here for review.</p></div><div class="row"><button id="refreshArchive" class="secondary">Refresh</button><button id="purgeArchive" class="danger">Delete Archived &gt; 60 Days</button></div></div><input id="archiveSearch" placeholder="Search order, SKU, title, location, or notes"><div id="archiveQueue"></div></div><div id="archiveDetail"></div></section>
<section id="direct" class="panel"><div class="card"><h2>Add Direct</h2><label>SellerChamp SKU</label><div class="row"><input id="directSku" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Enter SKU"><button id="directSpeak" type="button" class="secondary">🎤 Speak SKU</button><button id="cancelDirectSpeak" type="button" class="danger hidden">Cancel Listening</button><button id="directSearch">Search SKU</button></div><p id="directError" class="error"></p></div>
<div class="card"><h3>Search by UPC</h3><label>SellerChamp UPC</label><div class="row"><input id="directUpc" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Enter UPC"><button id="directUpcSearch">Search UPC</button></div></div>
<div class="card"><h3>Search by Title</h3><label>SellerChamp Title</label><div class="row"><input id="directTitle" autocomplete="off" placeholder="Enter all or part of title"><button id="directTitleSearch">Search Title</button></div></div>
<p id="directAltError" class="error"></p><div id="directChoices"></div><div id="directResult"></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
